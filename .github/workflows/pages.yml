name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: GitHub Pages'i yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Statik siteyi hazırla
        shell: bash
        run: |
          mkdir -p _site
          cp -R index.html css js vendor .nojekyll _site/

      - name: Pages paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Canlı demoyu yayımla
        id: deployment
        uses: actions/deploy-pages@v4
